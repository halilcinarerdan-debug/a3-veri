; ============================================================================
; extDB3 sunucu konfigurasyonu — VBS COIN Engine
;
; Konum: sunucunun calisma dizininde arma3server(.exe) ile ayni seviyede,
; extDB3 modunun bekledigi klasorde (fork'a gore "extDB3\" veya
; "@extDB3\extdb3-conf.ini"). Bu dosya PBO'ya paketlenmez, sadece sunucuya
; ayrica kopyalanir.
;
; SQF tarafi (vbs_fnc_query / vbs_fnc_execute) her cagriyi
; "<requestId>:SQL_CUSTOM_V2:<BlokAdi>:<param1>:<param2>..." seklinde
; gonderir; asagidaki her [BlokAdi] bolumu vbs_civilians / vbs_civilian_*
; / vbs_analytics semasindaki (bkz. sql/01_coin_engine_schema.sql) bir
; islemi karsilar. Tum degerler her zaman "?" ile pozisyonel bind edilir,
; hicbir SQF parametresi SQL metnine dogrudan gomulmez — SQL injection
; yuzeyi bu katmanda yapisal olarak yoktur.
;
; NOT (durustluk notu): asagidaki anahtar adlari (Number Of Inputs,
; Input_N[], SQL_N) extDB3'un yaygin/belgelenen SQL_CUSTOM_V2 seklidir;
; kullandiginiz extDB3 derlemesi (Torndeco orijinali veya bir fork) farkli
; bir surumse, canliya almadan once bu blogu extDB3'un kendi
; changelog/README'siyle ve extDB3.log debug ciktisiyla dogrulayin.
; ============================================================================

[Default]
Version         = 1
IP              = 127.0.0.1
Port            = 3306
Username        = vbs_coin_svc
Password        = CHANGE_ME_BEFORE_DEPLOY
Database        = vbs_coin
ConnectionCount = 4

; ----------------------------------------------------------------------------
; AddCivilianMemory — vbs_civilian_memory INSERT (fire-and-forget)
; SQF: ["AddCivilianMemory", [_civilianId, _soldierUid, _interactionType, _angerImpact]] call vbs_fnc_execute;
; ----------------------------------------------------------------------------
[AddCivilianMemory]
Number Of Inputs = 4
Input_1[] = NUMBER
Input_2[] = STRING
Input_3[] = STRING
Input_4[] = NUMBER

SQL_1 = INSERT INTO vbs_civilian_memory (civilian_id, soldier_uid, last_interaction_type, anger_impact) VALUES (?, ?, ?, ?);

; ----------------------------------------------------------------------------
; UpsertCivilianCognition — vbs_civilian_cognition UPDATE (fire-and-forget)
; SQF: ["UpsertCivilianCognition", [_westTrust, _opforSupport, _riotTendency, _emotion, _civilianId]] call vbs_fnc_execute;
; ----------------------------------------------------------------------------
[UpsertCivilianCognition]
Number Of Inputs = 5
Input_1[] = NUMBER
Input_2[] = NUMBER
Input_3[] = NUMBER
Input_4[] = STRING
Input_5[] = NUMBER

SQL_1 = UPDATE vbs_civilian_cognition SET west_trust = ?, opfor_support = ?, riot_tendency = ?, current_emotion = ? WHERE civilian_id = ?;

; ----------------------------------------------------------------------------
; GetHighRiotCivilians — vbs_civilian_cognition + vbs_civilians SELECT
; SQF: ["GetHighRiotCivilians", [_riotThreshold]] call vbs_fnc_query;
; ----------------------------------------------------------------------------
[GetHighRiotCivilians]
Number Of Inputs = 1
Input_1[] = NUMBER

SQL_1 = SELECT c.civilian_id, c.national_id, c.current_pos_x, c.current_pos_y, c.current_pos_z, k.riot_tendency, k.west_trust FROM vbs_civilians c INNER JOIN vbs_civilian_cognition k ON k.civilian_id = c.civilian_id WHERE c.status = 'ALIVE' AND k.riot_tendency >= ?;

; ----------------------------------------------------------------------------
; GetSafehouseByObject — vbs_world_state SELECT (baskin/raid dogrulamasi)
; SQF: ["GetSafehouseByObject", [_worldName, _objectId]] call vbs_fnc_query;
; ----------------------------------------------------------------------------
[GetSafehouseByObject]
Number Of Inputs = 2
Input_1[] = STRING
Input_2[] = NUMBER

SQL_1 = SELECT state_id, building_health, is_destroyed, is_safehouse FROM vbs_world_state WHERE world_name = ? AND object_id = ?;

; ----------------------------------------------------------------------------
; RegisterRoeViolation — vbs_analytics INSERT (fire-and-forget)
; SQF: ["RegisterRoeViolation", [_eventType, _gridPos, _summary, _impactJson, _mediaExposure, _relatedCivilianId, _relatedClanId]] call vbs_fnc_execute;
; ----------------------------------------------------------------------------
[RegisterRoeViolation]
Number Of Inputs = 7
Input_1[] = STRING
Input_2[] = STRING
Input_3[] = STRING
Input_4[] = STRING
Input_5[] = NUMBER
Input_6[] = NUMBER
Input_7[] = NUMBER

SQL_1 = INSERT INTO vbs_analytics (event_type, grid_pos, short_summary, impact_metrics_text, media_exposure, related_civilian_id, related_clan_id) VALUES (?, ?, ?, ?, ?, ?, ?);
