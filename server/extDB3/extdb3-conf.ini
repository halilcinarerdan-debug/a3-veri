; =============================================================================
; VBS COIN - extDB3 sunucu yapilandirmasi
; -----------------------------------------------------------------------------
; BU DOSYA PBO ICINDE DEGILDIR. Arma3Server calisma dizininin koklerine (hem
; ana dedicated server hem de her Headless Client sureci icin AYRI AYRI,
; kendi calisma dizinlerine) kopyalanir: <arma3server_calisma_dizini>/extDB3/
;
; extDB3'un tam anahtar/section adlari kullandiginiz forka (Torndeco orijinali
; veya SaMatra bakim surumu) ve surume gore ufak farklar gosterebilir. Asagidaki
; blok en yaygin/guncel extDB3 v3 kurulumlariyla uyumludur; kurulumunuzdaki
; extDB3 wiki'siyle karsilastirip DOGRULAYIN.
; =============================================================================

[Main]
Version = 3

[Database]
Type = MySQL
Name = vbs_coin
; Bazi extDB3 surumleri burada ek bir "Version" (DB profil semasi surumu)
; alani bekler; kurulumunuza gore ekleyin/kaldirin.

[vbs_coin]
IP = 127.0.0.1
Port = 3306
Username = vbs_coin_user
Password = CHANGE_ME
Database = vbs_coin
; Asenkron yuk altinda (birden fazla es zamanli sorgu) kilitlenmemesi icin
; havuzu birden fazla baglanti ile acin.
ConnectionPoolSize = 8
