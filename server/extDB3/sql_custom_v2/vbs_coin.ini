; =============================================================================
; VBS COIN - extDB3 SQL_CUSTOM_V2 cagri tanimlari
; -----------------------------------------------------------------------------
; Her [SectionName] burada vbs_fnc_query / vbs_fnc_execute'a birinci parametre
; (_callName) olarak verilen ayni string olmalidir (ör. "VBS_MEMORY_INSERT").
; SQF tarafindan gonderilen parametreler '?' yerlerine SIRAYLA baglanir
; (prepared statement - injection'a kapali).
;
; NOT: SQL1_1 anahtar adi / birden fazla ifadeyi tek cagrida zincirleme sozdizimi
; extDB3 surumunuze gore degisebilir. Kurulumunuzdaki extDB3 wiki'si ile
; DOGRULAYIN; call adlarini ve parametre sirasini SQF tarafiyla (fnc_dispatch.sqf
; uzerinden gecen _params dizisi) birebir esit tutmak yeterlidir.
; =============================================================================

; -- Taktiksel hafiza: yazma (asker/bot bir sivilie temas etti) -----------------
[VBS_MEMORY_INSERT]
SQL1_1 = INSERT INTO vbs_civilian_memory (civilian_id, actor_uid, actor_bot_id, interaction_type, anger_impact, interaction_pos_x, interaction_pos_y, interaction_pos_z) VALUES (?, ?, ?, ?, ?, ?, ?, ?);

; -- Taktiksel hafiza: okuma (bu sivil bu askeri/botu hatirliyor mu?) ----------
[VBS_MEMORY_LOOKUP]
SQL1_1 = SELECT interaction_type, anger_impact, occurred_at FROM vbs_civilian_memory WHERE civilian_id = ? AND actor_uid = ? ORDER BY occurred_at DESC LIMIT 5;

; -- Bilissel durum guncelleme (WEST_Trust / OPFOR_Support / riot_tendency) ----
; Deltalari 0-100 araliginda kelepceler (CHECK kisitina asla carpmaz).
[VBS_COGNITION_UPSERT]
SQL1_1 = UPDATE vbs_civilian_cognition SET west_trust = GREATEST(0, LEAST(100, west_trust + ?)), opfor_support = GREATEST(0, LEAST(100, opfor_support + ?)), current_emotion = ?, riot_tendency = GREATEST(0, LEAST(100, riot_tendency + ?)) WHERE civilian_id = ?;

; -- Sanal OPFOR komutan tick'i: SPATIAL INDEX ile radius icindeki gruplar -----
; Parametreler: merkez_x, merkez_y, yaricap(metre). MBRContains + SPATIAL INDEX
; sayesinde full table scan yerine indeks kullanilir (bkz. sql/001_vbs_coin_schema.sql).
[VBS_COMMANDER_TICK_FETCH]
SQL1_1 = SELECT group_id, strength, current_task, virtual_pos_x, virtual_pos_y, virtual_pos_z FROM vbs_commander_cache WHERE side = 'OPFOR' AND MBRContains(ST_Buffer(ST_SRID(POINT(?, ?), 0), ?), virtual_pos_geom);

; -- Dunya durumu (bina hasari/yikim) - upsert -----------------------------------
[VBS_WORLD_STATE_UPSERT]
SQL1_1 = INSERT INTO vbs_world_state (map_name, object_tag, building_type, health_percentage, is_destroyed, crater_pos_x, crater_pos_y, crater_pos_z, last_hit_by_uid) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?) ON DUPLICATE KEY UPDATE health_percentage = VALUES(health_percentage), is_destroyed = VALUES(is_destroyed), crater_pos_x = VALUES(crater_pos_x), crater_pos_y = VALUES(crater_pos_y), crater_pos_z = VALUES(crater_pos_z), last_hit_by_uid = VALUES(last_hit_by_uid), destroyed_at = IF(VALUES(is_destroyed) = 1 AND is_destroyed = 0, NOW(3), destroyed_at);

; -- AAR / stratejik etki gunlugu - fire-and-forget insert ----------------------
[VBS_ANALYTICS_INSERT]
SQL1_1 = INSERT INTO vbs_analytics (event_type, grid_pos_x, grid_pos_y, grid_pos_z, related_clan_id, short_summary, impact_metrics, civilian_casualties_by_riot) VALUES (?, ?, ?, ?, ?, ?, ?, ?);
