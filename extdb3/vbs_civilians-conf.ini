; ============================================================================
; extDB3 (Torndeco) — SQL_CUSTOM_V2 Prosedur Tanimi
; KATMAN 1: vbs_civilians INSERT sablonu
;
; Bu blok extdb3-conf.ini icindeki ilgili [Protocolx] tanimina (SQL_CUSTOM_V2,
; bu dosyayi gosteren) eklenmelidir. Cagrim SQF tarafinda:
;
;   "extDB3" callExtensionAsync format ["%1:VBS_INSERT_CIVILIAN:%2", VBS_EXTDB3_PROTOCOL_ID, _paramString];
;
; _paramString alanlari '^' ile ayrilmis, siralamasi Input1..Input10 ile birebir
; aynidir. Parametreli sorgu (prepared statement) kullanildigi icin SQL
; injection riski yoktur.
;
; NOT: extDB3 surumune gore anahtar isimleri (Input#[], SQL#_#) degisebilir;
; kuruldugunuz extDB3 wiki'sine gore dogrulayin.
; ============================================================================

[VBS_INSERT_CIVILIAN]
Mode = SQL_CUSTOM_V2
Default_Locked = 1

Number_Of_Inputs = 10

Input1[]  = {"STRING", ""}   ; national_id
Input2[]  = {"STRING", ""}   ; name
Input3[]  = {"NUMBER", "0"}  ; clan_id
Input4[]  = {"STRING", ""}   ; home_pos
Input5[]  = {"STRING", ""}   ; work_pos
Input6[]  = {"STRING", ""}   ; current_pos
Input7[]  = {"NUMBER", "0"}  ; vehicle_id
Input8[]  = {"STRING", ""}   ; ace_medical_status
Input9[]  = {"STRING", ""}   ; inventory
Input10[] = {"NUMBER", "1"}  ; status

SQL1_1 = INSERT INTO vbs_civilians
    (national_id, name, clan_id, home_pos, work_pos, current_pos, vehicle_id, ace_medical_status, inventory, status)
    VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
    ON DUPLICATE KEY UPDATE id = id;
